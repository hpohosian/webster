services:
  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ./webster-backend/.env
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-webster_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── NestJS backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./webster-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ./webster-backend/.env
    environment:
      DB_HOST: postgres
    ports:
      - "3000:3000"

  # ─── Mock / external-API proxy ──────────────────────────────────────────────
  mock-server:
    build:
      context: .
      dockerfile_inline: |
        FROM node:20-alpine
        WORKDIR /app
        COPY server/mock-server.mjs ./server/mock-server.mjs
        EXPOSE 8787
        CMD ["node", "server/mock-server.mjs"]
    restart: unless-stopped
    env_file: ./webster-frontend/.env
    ports:
      - "8787:8787"

  # ─── React Router frontend (SSR) ────────────────────────────────────────────
  frontend:
    build:
      context: ./webster-frontend
    restart: unless-stopped
    depends_on:
      - backend
      - mock-server
    env_file: ./webster-frontend/.env
    environment:
      VITE_API: http://localhost:3000
    ports:
      - "5173:3000"

volumes:
  postgres_data: